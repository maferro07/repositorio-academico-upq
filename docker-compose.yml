# Repositorio Académico UPQ — adaptado del Mini Data Center (Centro de Datos)
# Arranque:  cp .env.example .env  &&  docker compose up -d --build
name: minidc

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  DB_HOST: db
  DB_NAME: dc_app
  DB_USER: app_user
  DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}

x-nodo-web: &nodo-web              # plantilla de cada réplica de la app Flask
  build: ./app
  image: repoupq/app:1.0
  restart: unless-stopped
  networks: [red_publica, red_datos]
  logging: *logging
  depends_on:
    db: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/salud',timeout=3).status==200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  lb:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${LB_PUERTO:-8080}:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [red_publica]
    depends_on: [web1]
    logging: *logging

  web1:
    <<: *nodo-web
    environment:
      <<: *app-env
      NODO_ID: web1
      NODO_NOMBRE: "Nodo Alfa"
      NODO_COLOR: "#1f6feb"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en el archivo .env}
      MARIADB_DATABASE: dc_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Define GRAFANA_DB_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PUERTO:-3307}:3306"
    networks: [red_datos]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  loki:
    image: grafana/loki:3.6.12
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observabilidad/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks: [red_datos]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./observabilidad/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:12345:12345"
    networks: [red_datos]
    depends_on: [loki]
    logging: *logging

  grafana:
    image: grafana/grafana:12.4.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin_dc}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en el archivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/minidc.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PUERTO:-3000}:3000"
    networks: [red_datos]
    depends_on: [loki, db]
    logging: *logging

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
    networks: [red_gestion]
    logging: *logging

volumes:
  db_data:
  loki_data:
  grafana_data:
  portainer_data:

networks:
  red_publica:
  red_datos:
  red_gestion:
