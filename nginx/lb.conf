# ═══════════════════════════════════════════════════════════════════
#  BALANCEADOR DE CARGA (servicio "lb")
#  La "recepcionista" del edificio: recibe cada petición en :80 y la
#  reenvía a uno de los nodos de la granja web.
# ═══════════════════════════════════════════════════════════════════

# Bitácora en JSON → Alloy la recolecta → Loki la guarda → Grafana la grafica.
# $upstream_http_x_nodo = cabecera X-Nodo que devuelve el nodo que atendió.
log_format bitacora_json escape=json
  '{"tiempo":"$time_iso8601","cliente":"$remote_addr","metodo":"$request_method",'
  '"uri":"$uri","estado":$status,"bytes":$body_bytes_sent,'
  '"nodo":"$upstream_http_x_nodo","upstream":"$upstream_addr",'
  '"t_upstream":"$upstream_response_time","t_total":$request_time,'
  '"agente":"$http_user_agent"}';

# DNS interno de Docker: permite que el balanceador descubra nodos
# que se encienden/apagan sin reiniciarse (parámetro "resolve").
resolver 127.0.0.11 valid=5s ipv6=off;

upstream granja_web {
    zone granja_web 64k;

    # ✏️ ZONA EDITABLE 1 · ALGORITMO DE BALANCEO ─────────────────────
    # Por defecto: round robin (turnos: web1 → web2 → web3 → web1 ...)
    # Descomenta UNA línea para probar otro algoritmo:
    # least_conn;      # al nodo con menos conexiones activas
    # ip_hash;         # el mismo cliente siempre cae en el mismo nodo
    # ────────────────────────────────────────────────────────────────

    # ✏️ ZONA EDITABLE 2 · NODOS Y PESOS ─────────────────────────────
    # weight=3 → ese nodo recibe 3 veces más peticiones que uno con weight=1
    # max_fails/fail_timeout → si falla 2 veces, se saca 10 s (disponibilidad)
    server web1:80 resolve weight=1 max_fails=2 fail_timeout=10s;
    server web2:80 resolve weight=1 max_fails=2 fail_timeout=10s;
    server web3:80 resolve weight=1 max_fails=2 fail_timeout=10s;
    # server web4:80 resolve weight=1;          # Reto: añade un 4.º nodo
    # server web3:80 resolve backup;             # Reto: nodo de respaldo
    # ────────────────────────────────────────────────────────────────

    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;                       # no revelar versión (seguridad)
    access_log /var/log/nginx/access.log bitacora_json;

    add_header X-Balanceador "nginx-lb" always;

    # Cabeceras de seguridad básicas (integridad del contenido)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # ── Todo lo estático va a la granja web ──
    location / {
        proxy_pass http://granja_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si un nodo falla, reintenta en otro (failover transparente)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # ── Los datos van a la API (que habla con MariaDB) ──
    location /api/ {
        set $api_destino http://api:5000;    # con variable: se re-resuelve por DNS
        proxy_pass $api_destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;            # límite de tamaño (integridad)
    }

    # ── Ficha técnica del balanceador (la consulta la página) ──
    # ✏️ Si cambias el algoritmo arriba, actualiza también este texto.
    location = /lb-info {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"balanceador":"nginx","algoritmo":"round_robin","upstream":"granja_web"}';
    }

    # Estado interno de Nginx (conexiones activas), solo para pruebas locales
    location = /lb-status {
        stub_status;
        access_log off;
    }
}
