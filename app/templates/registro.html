{% extends "base.html" %}
{% block titulo %}Crear cuenta · Repositorio UPQ{% endblock %}
{% block contenido %}
<h1>Crear cuenta</h1>
<form method="post" class="formulario angosto">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Nombre completo
    <input name="nombre" required minlength="2" maxlength="100" autocomplete="name" value="{{ request.form.get('nombre', '') }}">
  </label>
  <label>Correo institucional
    <input type="email" name="correo" required autocomplete="username" placeholder="matricula@upq.edu.mx" value="{{ request.form.get('correo', '') }}">
    <small>Solo se aceptan correos @upq.edu.mx.</small>
  </label>
  <label>Contraseña (mínimo 8 caracteres)
    <input type="password" name="clave" required minlength="8" maxlength="128" autocomplete="new-password">
  </label>
  <label>Repite la contraseña
    <input type="password" name="clave2" required minlength="8" maxlength="128" autocomplete="new-password">
  </label>
  <button class="boton">Crear cuenta</button>
  <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Entra aquí</a>.</p>
</form>
{% endblock %}
