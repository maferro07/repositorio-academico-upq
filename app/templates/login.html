{% extends "base.html" %}
{% block titulo %}Entrar · Repositorio UPQ{% endblock %}
{% block contenido %}
<h1>Entrar</h1>
<form method="post" class="formulario angosto">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Correo institucional
    <input type="email" name="correo" required autocomplete="username" placeholder="matricula@upq.edu.mx">
  </label>
  <label>Contraseña
    <input type="password" name="clave" required autocomplete="current-password">
  </label>
  <button class="boton">Entrar</button>
  <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>.</p>
</form>
{% endblock %}
